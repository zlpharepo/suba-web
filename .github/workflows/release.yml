name: Web

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build
      - name: Package web assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          tar -C dist -czf suba-web.tar.gz .
          sha256sum suba-web.tar.gz > suba-web.tar.gz.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" suba-web.tar.gz suba-web.tar.gz.sha256 --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
    permissions:
      contents: write
